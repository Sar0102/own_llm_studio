# Document Validator — секция графа для doc_type: architecture
# Читает ТОЛЬКО worker этого документа. Рёбра между документами — в graph/edges.yaml

doc_type: architecture
title: Детальная архитектура
sections:
- name: Структура
  children:
  - name: Компонентно-логическая диаграмма
    markers:
    - uml
  - name: Компоненты
    markers:
    - table
  - name: Программные интерфейсы
  - name: Схемы структур данных
  - name: Физические модели баз данных
  - name: Элементы развертывания
    markers:
    - table
  - name: Диаграммы развертывания
    markers:
    - link
- name: Поведение
  children:
  - name: Взаимодействия
    markers:
    - table
  - name: Диаграммы последовательностей
    markers:
    - uml
  - name: Механизмы безопасности
  - name: Прочие поведенческие механизмы
- name: Прочие аспекты
  children:
  - name: Сценарии отказа
    markers:
    - table
notes:
- id: N-AR-1
  scope: intra-doc
  text: 'Компонентно-логическая диаграмма основана на: Компоненты, Варианты и сценарии использования (акторы),
    Программные интерфейсы, Взаимодействия.

    '
- id: N-AR-2
  scope: intra-doc
  text: 'Диаграммы последовательностей — графическое представление каждого use case.

    '
- id: N-AR-3
  scope: intra-doc
  text: '«Компоненты»: должны быть указаны все компоненты продукта и описана их ответственность. Если
    компонент внешний — это должно быть указано в явном виде.'
- id: N-AR-4
  scope: intra-doc
  text: На компонентно-логической диаграмме должны быть указаны все протоколы взаимодействия — либо подписями
    к стрелкам, либо легендой под диаграммой.
- id: N-AR-5
  scope: intra-doc
  text: '«Физические модели баз данных»: физическая модель БД приводится для каждого компонента, имеющего
    в составе БД. В репозиторий следует включать артефакт `/info/db-models.json`.'
- id: N-AR-6
  scope: intra-doc
  text: «Элементы развертывания» не должны противоречить диаграммам развертывания; приводятся все элементы
    развертывания продукта и входящих в него компонентов. Элементы должны быть отражены в `/deployment-units-{код
    компонента}-{версия компонента}.json`.
- id: N-AR-7
  scope: intra-doc
  text: '«Прочие поведенческие механизмы»: при использовании кеша описать цель использования и состав
    информации в нём; при неиспользовании — указать это в явном виде.'
- id: N-AR-8
  scope: intra-doc
  text: 'Для каждого сценария использования необходимо привести диаграмму последовательностей. Диаграмма
    должна содержать: компоненты программного продукта, акторов use case диаграммы и названия операций
    из секции «Программные интерфейсы».'
facts_to_extract:
  Взаимодействия:
    fact: item_names
    spec: Список названий пунктов/подразделов раздела.
  Диаграммы последовательностей:
    fact: scenario_names
    spec: Список названий сценариев (только заголовки, без содержимого).
  Компоненты:
    fact:
    - component_list
    - presence
    spec: Список имён компонентов.
  Механизмы безопасности:
    fact: section_digest
    spec: 'Дайджест ≤ 15 строк: ключевые утверждения раздела своими словами.'
  Программные интерфейсы:
    fact: presence
    spec: true/false — раздел или документ присутствует.
  Сценарии отказа:
    fact:
    - component_list
    - spo_list
    spec: Список имён компонентов.
  Физические модели баз данных:
    fact: item_names
    spec: Список названий пунктов/подразделов раздела.
  Элементы развертывания:
    fact:
    - item_names
    - presence
    spec: Список названий пунктов/подразделов раздела.
